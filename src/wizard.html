<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contextura Setup</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f7;
      --card: rgba(255, 255, 255, 0.94);
      --ink: #122033;
      --muted: #516276;
      --line: rgba(18, 32, 51, 0.1);
      --accent: #0f766e;
      --accent-strong: #115e59;
      --accent-soft: rgba(15, 118, 110, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.22), transparent 38%),
        radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.16), transparent 32%),
        linear-gradient(180deg, #f5f7fb 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 28px 70px rgba(18, 32, 51, 0.16);
      overflow: hidden;
      backdrop-filter: blur(24px);
    }

    .progress {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 24px 28px 0;
    }

    .progress span {
      height: 6px;
      border-radius: 999px;
      background: rgba(18, 32, 51, 0.08);
      transition: background 0.2s ease;
    }

    .progress span.active {
      background: linear-gradient(90deg, var(--accent), #2563eb);
    }

    .content {
      padding: 28px;
      display: grid;
      gap: 18px;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-strong);
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.82);
      display: grid;
      gap: 10px;
    }

    .panel strong {
      font-size: 14px;
    }

    .panel code {
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(18, 32, 51, 0.06);
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 12px;
    }

    .meta-list {
      display: grid;
      gap: 10px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .meta-list li {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .meta-list li:last-child {
      border-bottom: none;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 600;
      width: fit-content;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 0 28px 28px;
      flex-wrap: wrap;
    }

    .left-actions, .right-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    }

    button:active { transform: scale(0.98); }

    .primary {
      background: linear-gradient(90deg, var(--accent), #2563eb);
      color: white;
    }

    .secondary {
      background: rgba(18, 32, 51, 0.08);
      color: var(--ink);
    }

    .ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }

    @media (max-width: 640px) {
      .actions { padding-top: 8px; }
      .left-actions, .right-actions { width: 100%; }
      .left-actions button, .right-actions button { flex: 1; }
      .meta-list li { flex-direction: column; gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="progress" aria-hidden="true">
      <span class="active"></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="content">
      <div class="eyebrow" id="step-label">Step 1 of 4</div>
      <h1 id="title">Allow screen capture.</h1>
      <p id="body"></p>
      <div class="status" id="status-pill"></div>
      <div class="panel" id="panel"></div>
    </div>
    <div class="actions">
      <div class="left-actions">
        <button class="ghost" id="back-btn">Back</button>
        <button class="secondary" id="side-btn">Open System Settings</button>
      </div>
      <div class="right-actions">
        <button class="secondary" id="skip-btn">Skip for now</button>
        <button class="primary" id="next-btn">Continue</button>
      </div>
    </div>
  </div>

  <script src="wizard.js" defer></script>
</body>
</html>
